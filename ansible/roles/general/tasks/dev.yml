# vim:ft=yaml.ansible
---
- name: Create directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: '755'
  loop:
    - .config
    - .local/bin
    - Developer
    - Developer/Clients
    - Developer/Personal
    - Developer/PoC
    - Developer/Global
    - .config/lazygit
    - .config/ghostty
    - .config/yazi
    - .config/mise
    - .config/herdr

- name: Docker global docker-compose
  ansible.builtin.copy:
    src: "{{ role_path }}/files/docker-compose.yml"
    dest: "{{ ansible_facts['env']['HOME'] }}/Developer/Global/docker-compose.yml"
    mode: '644'
    force: false

- name: ZSH OMZ stat
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/oh-my-zsh.sh"
  register: zsh_status

- name: Install OhMyZSH
  ansible.builtin.shell: |
    sh -c "$(curl -fsSL https://raw.githubusercontent.com/ohmyzsh/ohmyzsh/master/tools/install.sh)" "" --unattended
  args:
    creates: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/oh-my-zsh.sh"
  when:
    - not ansible_check_mode
    - not zsh_status.stat.exists

- name: Check mode | Oh My Zsh install preview
  ansible.builtin.debug:
    msg: "Would install Oh My Zsh ({{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/oh-my-zsh.sh missing)."
  when:
    - ansible_check_mode
    - not zsh_status.stat.exists

- name: Ensure OhMyZSH plugins directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins"
    state: directory
    mode: '755'
  when: not ansible_check_mode

- name: Download OhMyZSH plugins
  ansible.builtin.git:
    repo: "https://github.com/{{ item }}"
    dest: "{{ ansible_facts['env']['HOME'] }}/.oh-my-zsh/custom/plugins/{{ item | basename }}"
    version: master
    update: true
  loop:
    - joshskidmore/zsh-fzf-history-search
    - zsh-users/zsh-autosuggestions
    - zsh-users/zsh-syntax-highlighting
  when: not ansible_check_mode

- name: Check mode | OhMyZSH plugins sync preview
  ansible.builtin.debug:
    msg: "Would sync Oh My Zsh plugins to latest master."
  when: ansible_check_mode

- name: Ensure that ssh directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    state: directory
    mode: '700'

- name: Ensure SSH backup directory exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.ssh-backups"
    state: directory
    mode: '700'

- name: Restore SSH bundle into ~/.ssh
  when: not ansible_check_mode
  block:
    - name: Create temporary SSH bundle file path
      ansible.builtin.tempfile:
        state: file
        suffix: .tar.gz
      register: ssh_bundle_temp

    - name: Copy and decrypt SSH bundle
      ansible.builtin.copy:
        src: "{{ role_path }}/files/ssh/ssh_bundle.tar.gz.vault"
        dest: "{{ ssh_bundle_temp.path }}"
        decrypt: true
        mode: '600'

    # GNU tar is required (gtar from brew on macOS). Mode/mtime differences are
    # ignored on purpose - permissions are normalised by the tasks below.
    - name: Compare SSH bundle with ~/.ssh
      ansible.builtin.command:
        argv:
          - "{{ 'gtar' if ansible_facts['os_family'] == 'Darwin' else 'tar' }}"
          - --compare
          - --exclude=environment-*
          - -zf
          - "{{ ssh_bundle_temp.path }}"
          - -C
          - "{{ ansible_facts['env']['HOME'] }}/.ssh"
      register: ssh_bundle_compare
      changed_when: false
      failed_when: ssh_bundle_compare.rc > 1

    - name: Decide whether SSH bundle needs restoring
      ansible.builtin.set_fact:
        ssh_bundle_differs: >-
          {{ (ssh_bundle_compare.stdout ~ ssh_bundle_compare.stderr)
             is search('Contents differ|Size differs|No such file|File type differs|Symlink differs|Not a regular file') }}

    - name: Find existing SSH files
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.ssh"
        file_type: file
      register: ssh_existing_files
      when: ssh_bundle_differs

    - name: Backup SSH directory before replacing
      ansible.builtin.command:
        argv:
          - tar
          - -czf
          - "{{ ansible_facts['env']['HOME'] }}/.ssh-backups/ssh-{{ ansible_facts['date_time']['iso8601_basic_short'] }}.tar.gz"
          - -C
          - "{{ ansible_facts['env']['HOME'] }}"
          - .ssh
      changed_when: true
      when:
        - ssh_bundle_differs
        - ssh_existing_files.matched | int > 0

    - name: Unarchive SSH bundle into ~/.ssh
      ansible.builtin.unarchive:
        src: "{{ ssh_bundle_temp.path }}"
        dest: "{{ ansible_facts['env']['HOME'] }}/.ssh"
        remote_src: true
        # ssh-agent runtime state from the OMZ ssh-agent plugin; never restore a stale copy
        exclude:
          - environment-*
      when: ssh_bundle_differs

    - name: Find existing SSH backups
      ansible.builtin.find:
        paths: "{{ ansible_facts['env']['HOME'] }}/.ssh-backups"
        patterns: "ssh-*.tar.gz"
        file_type: file
      register: ssh_backup_files

    - name: Remove old SSH backups (keep last 10)
      ansible.builtin.file:
        path: "{{ item.path }}"
        state: absent
      loop: "{{ (ssh_backup_files.files | sort(attribute='path', reverse=true))[10:] }}"

  always:
    - name: Remove temporary SSH bundle file
      ansible.builtin.file:
        path: "{{ ssh_bundle_temp.path }}"
        state: absent
      when: ssh_bundle_temp.path is defined

- name: Check mode | SSH bundle restore preview
  ansible.builtin.debug:
    msg: "Would decrypt and restore SSH bundle into {{ ansible_facts['env']['HOME'] }}/.ssh."
  when: ansible_check_mode

- name: Collect SSH files
  ansible.builtin.find:
    paths: "{{ ansible_facts['env']['HOME'] }}/.ssh"
    file_type: file
  register: ssh_files

- name: SSH key permissions for private files
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '600'
  loop: "{{ ssh_files.files }}"
  when:
    - item.path | basename not in ['known_hosts', 'known_hosts.old', 'authorized_keys']
    - (item.path | basename) is not match('.*\\.pub$')

- name: SSH key permissions for public keys
  ansible.builtin.file:
    path: "{{ item.path }}"
    mode: '644'
  loop: "{{ ssh_files.files }}"
  when: (item.path | basename) is match('.*\\.pub$')

- name: Verify the origin is set correctly
  ansible.builtin.command: git remote get-url origin  # noqa: command-instead-of-module
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
  register: current_origin
  failed_when: false
  changed_when: false

- name: Check configured git remotes
  ansible.builtin.command: git remote  # noqa: command-instead-of-module
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
  register: dotfiles_remotes
  changed_when: false

- name: Set dotfiles remote URL
  ansible.builtin.command:
    argv:
      - git
      - remote
      - set-url
      - origin
      - git@github.com:Isur/dotfiles
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
  changed_when: true
  when:
    - "'origin' in dotfiles_remotes.stdout_lines"
    - current_origin.stdout != "git@github.com:Isur/dotfiles"

- name: Add dotfiles remote URL if missing
  ansible.builtin.command:
    argv:
      - git
      - remote
      - add
      - origin
      - git@github.com:Isur/dotfiles
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}/dotfiles"
  changed_when: true
  when: "'origin' not in dotfiles_remotes.stdout_lines"

- name: TMUX plugin manager
  ansible.builtin.git:
    repo: "https://github.com/tmux-plugins/tpm"
    dest: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm"
    version: master
    clone: true

- name: Link configs
  ansible.builtin.include_tasks: link.yml
  vars:
    links:
      - { src: "nvim", dest: "{{ ansible_facts['env']['HOME'] }}/.config/nvim" }
      - { src: "zshrc-local", dest: "{{ ansible_facts['env']['HOME'] }}/.zshrc" }
      - { src: "tmux.conf", dest: "{{ ansible_facts['env']['HOME'] }}/.tmux.conf" }
      - { src: "yazi/keymap.toml", dest: "{{ ansible_facts['env']['HOME'] }}/.config/yazi/keymap.toml"}
      - { src: "yazi/package.toml", dest: "{{ ansible_facts['env']['HOME'] }}/.config/yazi/package.toml"}
      - { src: "mise/config.toml", dest: "{{ ansible_facts['env']['HOME'] }}/.config/mise/config.toml"}
      - { src: "herdr/config.toml", dest: "{{ ansible_facts['env']['HOME'] }}/.config/herdr/config.toml"}

# ~/.config/ghostty/config is a local (untracked) entry point, not a symlink:
# Noctalia rewrites its `theme =` line, and that must not land in the repo.
- name: Ghostty | Check config entry point
  ansible.builtin.stat:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
  register: ghostty_config

- name: Ghostty | Remove old symlinked config
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
    state: absent
  when: ghostty_config.stat.islnk | default(false)

- name: Ghostty | Local config entry point
  ansible.builtin.copy:
    dest: "{{ ansible_facts['env']['HOME'] }}/.config/ghostty/config"
    mode: '644'
    backup: true
    content: |
      # Generated by ansible (dotfiles). Shared settings live in the repo file below.
      theme = {{ 'noctalia' if ansible_facts['distribution'] == 'Archlinux' else 'Kanagawabones' }}
      config-file = {{ role_path }}/files/ghostty

# Needs ~/.tmux.conf linked first. Works without a running tmux server.
- name: TMUX | Install plugins
  ansible.builtin.command: "{{ ansible_facts['env']['HOME'] }}/.tmux/plugins/tpm/bin/install_plugins"
  register: tpm_install
  changed_when: "'download success' in tpm_install.stdout"
  when: not ansible_check_mode

- name: Claude | Find skills
  ansible.builtin.find:
    paths: "{{ role_path }}/files/claude/skills"
    file_type: directory
    recurse: false
  register: claude_skills

- name: Claude | Ensure skills dir exists
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/.claude/skills"
    state: directory
    mode: "0755"

- name: Claude | Build skill links
  ansible.builtin.set_fact:
    claude_skill_links: >-
      {{ claude_skill_links | default([]) + [{
           'src': item.path,
           'dest': ansible_facts['env']['HOME'] ~ '/.claude/skills/' ~ (item.path | basename)
         }] }}
  loop: "{{ claude_skills.files }}"
  loop_control:
    label: "{{ item.path | basename }}"

- name: Claude | Link skills
  ansible.builtin.include_tasks: link.yml
  vars:
    links: "{{ claude_skill_links | default([]) }}"

- name: Check missing global mise tools
  ansible.builtin.command: mise ls --global --missing
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  register: mise_missing
  changed_when: false
  check_mode: false

- name: Install global mise tools
  ansible.builtin.command: mise install --yes
  args:
    chdir: "{{ ansible_facts['env']['HOME'] }}"
  changed_when: true
  when:
    - not ansible_check_mode
    - mise_missing.stdout | trim | length > 0

- name: Check mode | mise tools preview
  ansible.builtin.debug:
    msg: "Would install missing mise tools: {{ mise_missing.stdout_lines | map('split') | map('first') | join(', ') }}"
  when:
    - ansible_check_mode
    - mise_missing.stdout | trim | length > 0

# yazi (and ya) come from mise, so run through `mise exec`. `ya pkg install`
# always redeploys, so "changed" is reported only when a package dir appears.
- name: Yazi | Install packages from package.toml
  ansible.builtin.shell: |
    set -euo pipefail
    shopt -s nullglob
    cd "$HOME/.config/yazi"
    # count via positional args: bash array-length syntax would open a Jinja comment
    count() { set -- flavors/*.yazi plugins/*.yazi; echo "$#"; }
    before=$(count)
    mise exec -- ya pkg install
    after=$(count)
    [ "$before" = "$after" ] || echo YAZI_CHANGED
  args:
    executable: /bin/bash
  register: yazi_pkg
  changed_when: "'YAZI_CHANGED' in yazi_pkg.stdout"
  when: not ansible_check_mode
