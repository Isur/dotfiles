# vim:ft=yaml.ansible
---
- name: Arch | Create Linux directories
  ansible.builtin.file:
    path: "{{ ansible_facts['env']['HOME'] }}/{{ item }}"
    state: directory
    mode: '755'
  loop:
    - apps
    - Pictures/Screenshots

- name: Arch | Docker Group
  become: true
  ansible.builtin.group:
    name: docker
    state: present

- name: Arch | Add user to docker group
  become: true
  ansible.builtin.user:
    name: "{{ ansible_facts['user_id'] }}"
    groups: docker
    append: true

- name: Arch | Enable docker
  become: true
  ansible.builtin.systemd:
    name: docker
    enabled: true
    state: started

- name: Arch | Git Config
  ansible.builtin.include_tasks: link.yml
  vars:
    links:
      - { src: "git-configs/gitconfig", dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig" }
      - { src: "git-configs/gitconfig-gravyty", dest: "{{ ansible_facts['env']['HOME'] }}/.gitconfig-gravyty" }
      - { src: "git-configs/lazygit.yml", dest: "{{ ansible_facts['env']['HOME'] }}/.config/lazygit/config.yml" }
      - { src: "yazi/theme.arch.toml", dest: "{{ ansible_facts['env']['HOME'] }}/.config/yazi/theme.toml" }

- name: Arch | ZSH default shell
  become: true
  ansible.builtin.user:
    user: "{{ ansible_facts['user_id'] }}"
    shell: /usr/bin/zsh
